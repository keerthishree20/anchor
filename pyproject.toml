[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-kv"
version = "1.0.0"
description = "An append-only key-value store with crash recovery. No dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
anchor = "anchor.cli:main"

[tool.setuptools.packages.find]
include = ["anchor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --timeout=180"
